name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd7e44e7c9c7a85e
        with:
          go-version: '1.22'
      - run: mkdir dist && for os in linux darwin windows; do for arch in amd64 arm64; do ext=; test "$os" = windows && ext=.exe; GOOS=$os GOARCH=$arch go build -o "dist/screen-$os-$arch$ext" ./cmd/screen; done; done
      - uses: softprops/action-gh-release@72f2c25fcb4767f0e8f6f91c8f8c9f6b9a2b7d0
        with:
          files: dist/*
