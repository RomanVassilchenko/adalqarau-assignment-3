name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.7'
      - run: ./check.sh
      - run: mkdir dist && for os in linux darwin windows; do for arch in amd64 arm64; do ext=; test "$os" = windows && ext=.exe; GOOS=$os GOARCH=$arch go build -o "dist/screen-$os-$arch$ext" ./cmd/screen; done; done && (cd dist && sha256sum screen-* > SHA256SUMS)
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: dist/*
